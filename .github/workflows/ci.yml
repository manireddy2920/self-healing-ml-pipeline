name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      DATABASE_URL: "sqlite:///./test_shlp.db"
      MLFLOW_TRACKING_URI: "sqlite:///./test_mlruns.db"
      MLFLOW_EXPERIMENT_NAME: "shlp_ci"
      JWT_SECRET_KEY: "ci_test_secret_key_32chars_long_x"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sqlalchemy alembic pydantic pydantic-settings \
                      python-jose passlib "bcrypt==3.2.2" \
                      fastapi "uvicorn[standard]" python-multipart \
                      scikit-learn lightgbm numpy pandas scipy pyarrow \
                      mlflow httpx python-dotenv structlog tenacity \
                      pytest pytest-cov pytest-asyncio

      - name: Lint
        run: python -m ruff check src/ --select E,F,W --ignore E501,W291,W293
        continue-on-error: true

      - name: Run unit tests (fast)
        run: >
          python -m pytest
          tests/test_db.py
          tests/test_ingestion.py
          tests/test_drift.py
          tests/test_trigger.py
          -v --tb=short --no-cov -q

      - name: Run API + pipeline tests
        run: >
          python -m pytest
          tests/test_api.py
          tests/test_pipeline.py
          -v --tb=short --no-cov -q

      - name: Run training tests
        run: >
          python -m pytest
          tests/test_training.py
          -v --tb=short --no-cov -q

      - name: Run integration tests
        run: >
          python -m pytest
          tests/test_integration.py
          -v --tb=short --no-cov -q
