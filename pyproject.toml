[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "joblib>=1.4",
    # Drift detection
    "evidently>=0.4",
    # MLflow
    "mlflow>=2.11",
    # DVC
    "dvc==3.49.0",
    # FastAPI
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pydantic==2.7.0",
    "pydantic-settings==2.2.1",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",
    # Database
    "sqlalchemy==2.0.29",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    # Orchestration
    "prefect==2.19.7",
    # Dashboard
    "streamlit==1.33.0",
    "plotly==5.20.0",
    # Utilities
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "structlog==24.1.0",
    "pyarrow==15.0.2",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "ruff==0.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing -v"

[tool.ruff]
line-length = 100
target-version = "py311"
